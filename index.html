<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="RFP S-3 BASINLINK & BASINCAST: System Requirements Review demo for the Congo River Basin system of systems." />
  <title>S-3 BASINLINK SRR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230A0A0A' stroke='%23CFB991' stroke-width='2'/%3E%3Cpath d='M7 20.5c3-1 3.6-5.2 7-6.2s4.8 2.4 7.6 1.3c2-.8 2.6-3.1 3.4-4.6' fill='none' stroke='%237FCBEA' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" data-view="flow" data-mode="t" data-map="schematic">
    <div id="map" class="map"><div class="map-sch"></div><div class="map-globe" aria-hidden="true"></div><div class="map-ground"></div></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div class="brand-text">
          <span class="brand-kicker">Congo River Basin · SRR · RFP S-3</span>
          <span class="brand-title">BASINLINK &amp; BASINCAST</span>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="View">
        <span class="tabs-ink"></span>
        <button role="tab" id="tab-flow" data-view="flow" aria-controls="view-flow"><span class="t-n">1</span>Function flow</button>
        <button role="tab" id="tab-map" data-view="map" aria-controls="view-map"><span class="t-n">2</span>ConOps map</button>
        <button role="tab" id="tab-stations" data-view="stations" aria-controls="view-stations"><span class="t-n">3</span>Stations</button>
        <button role="tab" id="tab-sensors" data-view="sensors" aria-controls="view-sensors"><span class="t-n">4</span>Sensors</button>
        <button role="tab" id="tab-comms" data-view="comms" aria-controls="view-comms"><span class="t-n">5</span>Space<span class="t-long"> &amp; backhaul</span></button>
        <button role="tab" id="tab-budget" data-view="budget" aria-controls="view-budget"><span class="t-n">6</span>Cost<span class="t-long"> &amp; resilience</span></button>
        <button role="tab" id="tab-requirements" data-view="requirements" aria-controls="view-requirements"><span class="t-n">7</span>Requirements</button>
      </nav>
      <div class="top-right">
        <button class="offline" data-act="preload" data-state="loading" aria-live="polite"><i aria-hidden="true"></i><span>Loading…</span></button>
        <div class="mode" role="group" aria-label="Requirement values (T)">
          <button data-mode="t" aria-pressed="true">Threshold</button>
          <button data-mode="o" aria-pressed="false">Objective</button>
        </div>
        <span class="divider"></span>
        <button class="icon-btn" data-act="present" title="Presenter mode (P)" aria-label="Presenter mode" aria-pressed="false"></button>
        <button class="icon-btn" data-act="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen"></button>
        <button class="icon-btn" data-act="help" title="Shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      </div>
    </header>

    <section class="process-view" id="view-flow" role="tabpanel" aria-labelledby="tab-flow"></section>
    <section class="process-view" id="view-map" role="tabpanel" aria-labelledby="tab-map" hidden></section>
    <section class="process-view" id="view-stations" role="tabpanel" aria-labelledby="tab-stations" hidden></section>
    <section class="process-view" id="view-sensors" role="tabpanel" aria-labelledby="tab-sensors" hidden></section>
    <section class="process-view" id="view-comms" role="tabpanel" aria-labelledby="tab-comms" hidden></section>
    <section class="process-view" id="view-budget" role="tabpanel" aria-labelledby="tab-budget" hidden></section>
    <nav class="req-subnav glass" id="req-subnav" aria-label="Requirements views" hidden>
      <button data-view="overview">Mission &amp; gap</button>
      <button data-view="requirements">Level 0 (RFP)</button>
      <button data-view="decomposition">Decomposition (MO → L4)</button>
    </nav>
    <section class="process-view" id="view-overview" role="tabpanel" aria-label="Mission and gap" hidden></section>
    <section class="process-view" id="view-requirements" role="tabpanel" aria-labelledby="tab-requirements" hidden></section>
    <section class="sc-view" id="view-scenario" role="tabpanel" aria-label="Scenario walkthrough" hidden>
      <aside class="sc-card glass" id="sc-card" aria-label="Scenario steps"></aside>
      <div class="lt-card glass" id="lt-card" aria-label="Latency budget"></div>
      <div class="map-switch glass" role="group" aria-label="Map (M)">
        <button data-map="globe" aria-pressed="false" disabled>Globe</button>
        <button data-map="ground" aria-pressed="false">Ground</button>
        <button data-map="schematic" aria-pressed="true">Schematic</button>
        <span class="map-status" aria-live="polite"></span>
      </div>
    </section>
    <section class="dc-view" id="view-decomposition" role="tabpanel" aria-label="Decomposition" hidden></section>

    <aside class="panel glass" id="panel" aria-label="Details"></aside>
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <div class="help glass" id="help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
