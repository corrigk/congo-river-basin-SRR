<body>
  <div id="app" data-view="overview" data-mode="t" data-map="schematic">
    <div id="map" class="map"><div class="map-sch"></div><div class="map-globe" aria-hidden="true"></div><div class="map-ground"></div></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div class="brand-text">
          <span class="brand-kicker">Congo River Basin · SRR · RFP S-3</span>
          <span class="brand-title">BASINLINK &amp; BASINCAST</span>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="View">
        <span class="tabs-ink"></span>
        <button role="tab" id="tab-overview" data-view="overview" aria-controls="view-overview"><span class="t-long">S-3 </span>Overview</button>
        <button role="tab" id="tab-requirements" data-view="requirements" aria-controls="view-requirements">Requirements</button>
        <button role="tab" id="tab-scenario" data-view="scenario" aria-controls="view-scenario">Scenario</button>
        <button role="tab" id="tab-interfaces" data-view="interfaces" aria-controls="view-interfaces">Interfaces</button>
        <button role="tab" id="tab-trades" data-view="trades" aria-controls="view-trades">Trades<span class="t-long"> &amp; Open Items</span></button>
      </nav>
      <div class="top-right">
        <button class="offline" data-act="preload" data-state="loading" aria-live="polite"><i aria-hidden="true"></i><span>Loading…</span></button>
        <div class="mode" role="group" aria-label="Requirement values (T)">
          <button data-mode="t" aria-pressed="true">Threshold</button>
          <button data-mode="o" aria-pressed="false">Objective</button>
        </div>
        <span class="divider"></span>
        <button class="icon-btn" data-act="present" title="Presenter mode (P)" aria-label="Presenter mode" aria-pressed="false"></button>
        <button class="icon-btn" data-act="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen"></button>
        <button class="icon-btn" data-act="help" title="Shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      </div>
    </header>

    <section class="process-view" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="process-view" id="view-requirements" role="tabpanel" aria-labelledby="tab-requirements"></section>
    <section class="sc-view" id="view-scenario" role="tabpanel" aria-labelledby="tab-scenario">
      <aside class="sc-card glass" id="sc-card" aria-label="Scenario steps"></aside>
      <div class="lt-card glass" id="lt-card" aria-label="Latency budget"></div>
      <div class="map-switch glass" role="group" aria-label="Map (M)">
        <button data-map="globe" aria-pressed="false" disabled>Globe</button>
        <button data-map="ground" aria-pressed="false">Ground</button>
        <button data-map="schematic" aria-pressed="true">Schematic</button>
        <span class="map-status" aria-live="polite"></span>
      </div>
    </section>
    <section class="process-view" id="view-interfaces" role="tabpanel" aria-labelledby="tab-interfaces"></section>
    <section class="process-view" id="view-trades" role="tabpanel" aria-labelledby="tab-trades"></section>

    <aside class="panel glass" id="panel" aria-label="Details"></aside>
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <div class="help glass" id="help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
  </div>
</body>
</html>
